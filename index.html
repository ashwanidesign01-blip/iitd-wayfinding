<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IIT Delhi Campus Wayfinding</title>
<style>/* essential map-library styles, built in so the page works even where the library stylesheet is blocked */
.maplibregl-map{overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-top-right,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-top-left,.maplibregl-ctrl-bottom-left{position:absolute;pointer-events:none;z-index:2}
.maplibregl-ctrl-top-right{top:0;right:0}.maplibregl-ctrl-bottom-right{bottom:0;right:0}.maplibregl-ctrl-top-left{top:0;left:0}.maplibregl-ctrl-bottom-left{bottom:0;left:0}
.maplibregl-ctrl{clear:both;pointer-events:auto;transform:translate(0)}
.maplibregl-ctrl-top-right .maplibregl-ctrl{float:right;margin:10px 10px 0 0}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{float:right;margin:0 10px 10px 0}
.maplibregl-ctrl-group{background:#262626;border-radius:10px;box-shadow:0 2px 10px #0005;overflow:hidden}
.maplibregl-ctrl-group button{width:44px;height:44px;display:block;padding:0;border:0;background:transparent;cursor:pointer;color:#fff}
.maplibregl-ctrl-group button+button{border-top:1px solid #444}
.maplibregl-ctrl-icon{display:block;width:100%;height:100%;font:700 24px/44px 'IBM Plex Sans',sans-serif;text-align:center}
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon::before{content:'+'}
.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon::before{content:'\2212'}
.maplibregl-ctrl-scale{background:rgba(255,255,255,.8);border:2px solid #333;border-top:none;font-size:11px;padding:0 5px;color:#333}
.maplibregl-ctrl-attrib{background:rgba(255,255,255,.7);padding:0 5px;font-size:11px;color:#333}
.maplibregl-ctrl-attrib a{color:#333}
.maplibregl-ctrl-attrib-button{display:none}
.maplibregl-ctrl-compass .maplibregl-ctrl-icon::before{content:'N';font-size:16px}
</style>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Web stand-ins for your artwork fonts, used only where Hyperlegible Sans / Kohinoor Devanagari aren't installed -->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Hind:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=entr1">
</head>
<body>

<div class="corner" aria-label="Map controls">
  <button class="cbtn" id="compass" data-act="compass" aria-label="Compass"><svg class="needle" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3l4.5 12h-9z" fill="#ED1C24"/><path d="M15 27l-4.5-12h9z" fill="#BDBDBD"/><text x="15" y="10.5" font-size="6.5" font-weight="700" text-anchor="middle" fill="#fff" font-family="sans-serif">N</text></svg></button>
  <button class="cbtn" id="accessBtn" data-act="access" aria-haspopup="dialog" aria-label="Accessibility settings"><svg class="ic" aria-hidden="true"><use href="#i-access"/></svg></button>
</div>
<div class="edge">
  <div class="layersmenu" id="layersMenu" hidden role="radiogroup" aria-label="Map layer">
    <button role="radio" aria-checked="true" data-act="view" data-v="standard">Standard</button>
    <button role="radio" aria-checked="false" data-act="view" data-v="accessibility">Accessibility</button>
    <button role="radio" aria-checked="false" data-act="view" data-v="parking">Parking</button>
  </div>
  <button class="cbtn" id="layersBtn" data-act="layers" aria-haspopup="true" aria-expanded="false" aria-label="Map layers"><svg class="ic" aria-hidden="true"><use href="#i-layers"/></svg></button>
  <button class="cbtn" id="keyBtn" data-act="key" aria-label="Map key: what the colours and symbols mean"><span aria-hidden="true">?</span></button>
  <button class="cbtn" id="recenter" data-act="recenter" hidden aria-label="Back to my position"><svg class="ic" aria-hidden="true"><use href="#i-target"/></svg></button>
</div>
<div class="navcard" id="navcard" hidden aria-live="polite" aria-atomic="true"></div>
<div class="scrim" id="scrim" data-act="closeSearch" aria-hidden="true"></div>
<main class="sheet" id="sheet"></main>
<div class="modal" id="fromModal" hidden><div class="mpanel" id="panelFrom" role="dialog" aria-modal="true" aria-labelledby="fromTitle"></div></div>
<div class="modal" id="a11yModal" hidden><div class="mpanel a11y" id="a11yPanel" role="dialog" aria-modal="true" aria-labelledby="a11yTitle"></div></div>
<div class="modal" id="keyModal" hidden><div class="mpanel key" id="keyPanel" role="dialog" aria-modal="true" aria-labelledby="keyTitle"></div></div>


<section class="panel" id="panel" aria-label="Map tools" hidden>
  <div class="ph2"><h2>Map tools (design team)</h2><a class="x" href="#" aria-label="Close tools">✕</a></div>
  <div class="row"><label class="toggle"><input type="checkbox" id="testMode"> Test mode: simulate the walk instead of GPS</label></div>
  <h2 class="ph">Campus map</h2>
  <div class="row">
    <span class="label">View</span>
    <div class="seg" role="radiogroup" aria-label="Map view">
      <button role="radio" aria-checked="true" data-view="standard">Standard</button>
      <button role="radio" aria-checked="false" data-view="accessibility">Accessibility</button>
      <button role="radio" aria-checked="false" data-view="parking">Parking</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Map up</span>
    <div class="seg" role="radiogroup" aria-label="Map orientation">
      <button role="radio" aria-checked="true" data-orient="artwork">As drawn</button>
      <button role="radio" aria-checked="false" data-orient="north">North</button>
    </div>
    <button class="btn ghost" id="fitCampus">Whole campus</button>
  </div>
  <div class="row"><span class="label">Turn map</span><input type="range" id="turn" min="-180" max="180" step="1" value="0" aria-label="Turn the map (test)"><code id="turnVal">0°</code></div>
  <div class="row"><span class="label">Artwork</span><input type="range" id="opacity" min="0" max="100" aria-label="Artwork opacity"></div>
  <div class="row"><label class="toggle"><input type="checkbox" id="showChecks"> Show my check points (orange)</label></div>
  <details class="fine">
    <summary>Fine-tune alignment</summary>
    <div class="grid">
      <button class="nb" data-nudge="n" aria-label="Move north">N ↑</button>
      <button class="nb" data-nudge="s" aria-label="Move south">S ↓</button>
      <button class="nb" data-nudge="w" aria-label="Move west">W ←</button>
      <button class="nb" data-nudge="e" aria-label="Move east">E →</button>
      <button class="nb" data-nudge="rl" aria-label="Rotate anticlockwise">⟲</button>
      <button class="nb" data-nudge="rr" aria-label="Rotate clockwise">⟳</button>
      <button class="nb" data-nudge="sm" aria-label="Smaller">−</button>
      <button class="nb" data-nudge="sp" aria-label="Larger">+</button>
    </div>
    <label class="toggle"><input type="checkbox" id="bigSteps"> Big steps (5 m, 1.25°, 2.5%)</label>
    <p class="msg" id="adjustVals">E 0 m · N 0 m · rotate 0.00° · scale 100.0%</p>
    <div class="row"><button class="btn" id="copyAlign">Copy alignment</button><button class="btn ghost" data-nudge="reset">Reset</button></div>
  </details>
  <p class="msg" id="alignInfo"></p>
  <h2 class="ph">Base map</h2>
  <div class="row">
    <span class="label">Style</span>
    <div class="seg" role="radiogroup" aria-label="Base map style">
      <button role="radio" aria-checked="true" data-style="campus">Campus style</button>
      <button role="radio" aria-checked="false" data-style="osm">Standard OSM</button>
    </div>
  </div>
  <div class="row">
    <span class="label">Pointer</span>
    <code id="coords">move or tap the map</code>
  </div>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="pickMode"> Record control points (for Step 2)</label>
  </div>
  <ol id="points" class="points" aria-label="Recorded points"></ol>
  <div class="row" id="pointActions" hidden>
    <button class="btn" id="copyPoints">Copy points</button>
    <button class="btn ghost" id="clearPoints">Clear</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script src="js/map.js?v=entr1"></script>
<script src="data/artwork-svg.js?v=entr1"></script>
<script src="js/artwork.js?v=entr1"></script>
<script src="data/routes.js?v=entr1"></script>
<script src="js/app.js?v=entr1"></script>
</body>
</html>
